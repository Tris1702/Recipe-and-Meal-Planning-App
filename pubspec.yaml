name: recipe_meal_planner
description: Monorepo cho ứng dụng quản lý công thức và lập kế hoạch bữa ăn.
publish_to: none

environment:
  sdk: ^3.9.0

workspace:
  - packages/shared
  - packages/api_client
  - apps/api
  - apps/app

dev_dependencies:
  lints: ^6.0.0
  melos: ^8.0.0

melos:
  command:
    bootstrap:
      runPubGetInParallel: true
  scripts:
    analyze:
      description: Phân tích tĩnh toàn monorepo, coi info là lỗi.
      run: melos exec -- dart analyze --fatal-infos
    test:
      description: Unit test các package Dart thuần, không cần hạ tầng.
      run: melos exec --dir-exists=test --no-flutter -- dart test --exclude-tags=integration
    test:widget:
      description: Widget test cho ứng dụng Flutter.
      run: melos exec --dir-exists=test --flutter -- flutter test
    test:integration:
      description: Test repository chạy trên PostgreSQL thật.
      run: melos exec --scope=api -- dart test --tags=integration
